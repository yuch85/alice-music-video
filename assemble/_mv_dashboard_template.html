<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MV Clip Prompts QC - Modotte Oide Turbo</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #1a1a2e; color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px; line-height: 1.5;
}
a { color: #e94560; }

.header {
    background: #16213e; padding: 20px 24px;
    border-bottom: 2px solid #e94560;
    position: sticky; top: 0; z-index: 100;
}
.header h1 { font-size: 22px; color: #e94560; margin-bottom: 8px; }
.stats { display: flex; gap: 16px; font-size: 13px; }
.stats span { padding: 2px 10px; border-radius: 4px; background: #0f3460; }
.stats .approved { color: #4caf50; }
.stats .pending { color: #ff9800; }
.stats .rejected { color: #f44336; }

.toolbar {
    padding: 12px 24px; display: flex; gap: 8px;
    flex-wrap: wrap; align-items: center;
    background: #16213e; border-bottom: 1px solid #0f3460;
}
.toolbar button {
    padding: 6px 16px; border: 1px solid #0f3460;
    background: #0f3460; color: #e0e0e0; border-radius: 4px;
    cursor: pointer; font-size: 13px;
}
.toolbar button:hover, .toolbar button.active {
    background: #e94560; border-color: #e94560; color: #fff;
}
.toolbar .spacer { flex: 1; }
.export-btn {
    padding: 6px 16px; border: 1px solid #e94560;
    background: transparent; color: #e94560; border-radius: 4px;
    cursor: pointer; font-size: 13px;
}
.export-btn:hover { background: #e94560; color: #fff; }

.section-header {
    padding: 12px 24px; background: #0f3460;
    font-size: 15px; font-weight: 600; color: #e94560;
    border-bottom: 1px solid #16213e;
    margin-top: 8px;
}

.cards-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px; padding: 16px 24px;
}
@media (max-width: 1200px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 768px) { .cards-grid { grid-template-columns: 1fr; } }

.card {
    background: #16213e; border-radius: 8px;
    border: 1px solid #0f3460; overflow: hidden;
    display: flex; flex-direction: column;
}
.card.approved { border-color: #4caf50; }
.card.rejected { border-color: #f44336; }
.card-header {
    padding: 12px; display: flex; justify-content: space-between;
    align-items: flex-start; gap: 8px;
}
.card-id { font-weight: 700; color: #e94560; font-size: 15px; }
.card-sub { font-size: 12px; color: #888; }
.card-time { font-size: 12px; color: #aaa; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0; }
.tag {
    font-size: 10px; padding: 2px 6px; border-radius: 3px;
    font-weight: 600; text-transform: uppercase;
}
.tag-narrative { background: #1565c0; color: #fff; }
.tag-singer { background: #6a1b9a; color: #fff; }
.tag-broll { background: #2e7d32; color: #fff; }
.tag-convergence { background: #e65100; color: #fff; }
.tag-new { background: #e94560; color: #fff; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

.kf-thumb {
    width: 100%; aspect-ratio: 16/9; object-fit: cover;
    background: #0a0a1a; display: block;
}
.kf-thumb-placeholder {
    width: 100%; aspect-ratio: 16/9; display: flex;
    align-items: center; justify-content: center;
    background: #0a0a1a; color: #555; font-size: 12px;
}

.card-body { padding: 0 12px 12px; flex: 1; }
.meta-row { font-size: 12px; color: #aaa; margin: 2px 0; }
.meta-row strong { color: #ccc; }

.collapsible { margin-top: 8px; }
.collapsible-toggle {
    width: 100%; padding: 6px 8px; text-align: left;
    background: #0f3460; border: 1px solid #1a1a2e;
    color: #e0e0e0; border-radius: 4px; cursor: pointer;
    font-size: 12px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
}
.collapsible-toggle:hover { background: #1a3a6e; }
.collapsible-toggle .arrow { transition: transform 0.2s; }
.collapsible-toggle.open .arrow { transform: rotate(90deg); }
.collapsible-content {
    display: none; padding: 8px; margin-top: 4px;
    background: #0a0a1a; border-radius: 4px;
    font-size: 12px; line-height: 1.6;
}
.collapsible-content.open { display: block; }
.collapsible-content p { margin: 4px 0; }
.collapsible-content .meta { color: #888; font-size: 11px; }
.no-kf-note {
    font-size: 11px; color: #666; font-style: italic;
    padding: 4px 0;
}

.card-actions {
    padding: 8px 12px; border-top: 1px solid #0f3460;
    display: flex; gap: 6px; align-items: center;
}
.btn-approve {
    flex: 1; padding: 6px; border: 1px solid #4caf50;
    background: transparent; color: #4caf50; border-radius: 4px;
    cursor: pointer; font-size: 12px;
}
.btn-approve:hover { background: #4caf50; color: #fff; }
.btn-reject {
    flex: 1; padding: 6px; border: 1px solid #f44336;
    background: transparent; color: #f44336; border-radius: 4px;
    cursor: pointer; font-size: 12px;
}
.btn-reject:hover { background: #f44336; color: #fff; }
.btn-reset {
    padding: 6px 10px; border: 1px solid #555;
    background: transparent; color: #888; border-radius: 4px;
    cursor: pointer; font-size: 12px;
}
.btn-reset:hover { background: #555; color: #fff; }
.notes-area {
    width: 100%; margin-top: 6px; padding: 6px;
    background: #0a0a1a; border: 1px solid #0f3460;
    color: #e0e0e0; border-radius: 4px; font-size: 12px;
    resize: vertical; min-height: 36px; font-family: inherit;
}

.modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 200;
    align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
    background: #16213e; border: 1px solid #e94560;
    border-radius: 8px; padding: 24px; max-width: 800px;
    width: 90%; max-height: 80vh; overflow: auto;
}
.modal h2 { color: #e94560; margin-bottom: 12px; }
.modal pre {
    background: #0a0a1a; padding: 12px; border-radius: 4px;
    overflow: auto; font-size: 12px; max-height: 60vh;
    white-space: pre-wrap; word-break: break-all;
}
.modal-actions { display: flex; gap: 8px; margin-top: 12px; }
.modal-actions button {
    padding: 8px 20px; border-radius: 4px; cursor: pointer;
    font-size: 13px; border: 1px solid #e94560;
    background: #e94560; color: #fff;
}
.modal-actions button.secondary {
    background: transparent; color: #e94560;
}
</style>
</head>
<body>

<div class="header">
    <h1>MV Clip Prompts QC - Modotte Oide Turbo</h1>
    <div class="stats">
        <span>Total: <strong id="stat-total">0</strong></span>
        <span class="approved">Approved: <strong id="stat-approved">0</strong></span>
        <span class="pending">Pending: <strong id="stat-pending">0</strong></span>
        <span class="rejected">Rejected: <strong id="stat-rejected">0</strong></span>
    </div>
</div>

<div class="toolbar">
    <button class="active" onclick="filterShots('all', this)">All</button>
    <button onclick="filterShots('pending', this)">Pending</button>
    <button onclick="filterShots('approved', this)">Approved</button>
    <button onclick="filterShots('rejected', this)">Rejected</button>
    <button onclick="filterShots('new', this)">New Only</button>
    <span class="spacer"></span>
    <button class="export-btn" onclick="showExport()">Export JSON</button>
    <button class="export-btn" onclick="downloadCSV()">Download CSV</button>
</div>

<div id="sections-container"></div>

<div class="modal-overlay" id="export-modal">
    <div class="modal">
        <h2>QC Decisions Export</h2>
        <pre id="export-content"></pre>
        <div class="modal-actions">
            <button onclick="copyExport()">Copy to Clipboard</button>
            <button onclick="downloadJSON()">Download JSON</button>
            <button class="secondary" onclick="closeModal()">Close</button>
        </div>
    </div>
</div>

<script>
const SHOTS = SHOTS_JSON_PLACEHOLDER;
const STORAGE_KEY = 'mv_qc_decisions_v1';
let decisions = loadDecisions();
let currentFilter = 'all';

function loadDecisions() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : {};
    } catch(e) { return {}; }
}

function saveDecisions() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions));
    updateStats();
}

function getDecision(shotId) {
    return decisions[shotId] || { status: 'pending', notes: '' };
}

function setDecision(shotId, status) {
    const existing = decisions[shotId] || { status: 'pending', notes: '' };
    decisions[shotId] = { ...existing, status };
    saveDecisions();
    renderAll();
}

function setNotes(shotId, notes) {
    const existing = decisions[shotId] || { status: 'pending', notes: '' };
    decisions[shotId] = { ...existing, notes };
    saveDecisions();
}

function resetDecision(shotId) {
    delete decisions[shotId];
    saveDecisions();
    renderAll();
}

function updateStats() {
    const total = SHOTS.length;
    let approved = 0, rejected = 0, pending = 0;
    for (const s of SHOTS) {
        const d = getDecision(s.shot_id);
        if (d.status === 'approved') approved++;
        else if (d.status === 'rejected') rejected++;
        else pending++;
    }
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-approved').textContent = approved;
    document.getElementById('stat-pending').textContent = pending;
    document.getElementById('stat-rejected').textContent = rejected;
}

function filterShots(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderAll();
}

function matchesFilter(shot) {
    const d = getDecision(shot.shot_id);
    if (currentFilter === 'all') return true;
    if (currentFilter === 'new') return shot.is_new;
    return d.status === currentFilter;
}

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function renderAll() {
    const container = document.getElementById('sections-container');
    container.innerHTML = '';
    const grouped = {};
    for (const s of SHOTS) {
        const sec = s.section || 'Uncategorized';
        if (!grouped[sec]) grouped[sec] = { order: s.section_order, shots: [] };
        grouped[sec].shots.push(s);
    }
    const sorted = Object.entries(grouped).sort((a,b) => a[1].order - b[1].order);
    for (const [secName, secData] of sorted) {
        const visible = secData.shots.filter(matchesFilter);
        if (visible.length === 0) continue;
        const secEl = document.createElement('div');
        const gridId = 'grid-' + secData.order;
        secEl.innerHTML = '<div class="section-header">' + esc(secName) + '</div>' +
            '<div class="cards-grid" id="' + gridId + '"></div>';
        container.appendChild(secEl);
        const grid = secEl.querySelector('.cards-grid');
        for (const shot of visible) {
            grid.appendChild(createCard(shot));
        }
    }
    updateStats();
}

function tagClass(vt) {
    switch(vt) {
        case 'NARRATIVE': return 'tag-narrative';
        case 'SINGER': return 'tag-singer';
        case 'BROLL': return 'tag-broll';
        case 'CONVERGENCE': return 'tag-convergence';
        default: return 'tag-narrative';
    }
}

function metaHtml(obj) {
    let html = '';
    for (const [k, v] of Object.entries(obj || {})) {
        html += '<div class="meta"><strong>' + esc(k) + '</strong>: ' + esc(v) + '</div>';
    }
    return html;
}

function createCard(shot) {
    const d = getDecision(shot.shot_id);
    const card = document.createElement('div');
    card.className = 'card' + (d.status !== 'pending' ? ' ' + d.status : '');
    card.dataset.shotId = shot.shot_id;

    let kfThumb = '';
    if (shot.keyframe_b64) {
        kfThumb = '<img class="kf-thumb" src="' + shot.keyframe_b64 + '" alt="Keyframe ' + shot.shot_id + '">';
    } else {
        kfThumb = '<div class="kf-thumb-placeholder">No keyframe image</div>';
    }

    let kfSection = '';
    if (shot.has_keyframe_prompt) {
        kfSection = '<div class="collapsible">' +
            '<button class="collapsible-toggle" onclick="toggleCollapsible(this)">' +
            'Keyframe Prompt <span class="arrow">&#9654;</span></button>' +
            '<div class="collapsible-content">' +
            '<p>' + esc(shot.keyframe_prompt) + '</p>' +
            metaHtml(shot.keyframe_meta) +
            '</div></div>';
    } else if (shot.no_qei_note) {
        kfSection = '<div class="no-kf-note">' + esc(shot.no_qei_note) + '</div>';
    }

    let mpSection = '';
    if (shot.motion_prompt) {
        mpSection = '<div class="collapsible">' +
            '<button class="collapsible-toggle" onclick="toggleCollapsible(this)">' +
            'Motion Prompt <span class="arrow">&#9654;</span></button>' +
            '<div class="collapsible-content">' +
            '<p>' + esc(shot.motion_prompt) + '</p>' +
            metaHtml(shot.motion_meta) +
            '</div></div>';
    }

    let tags = '<span class="tag ' + tagClass(shot.visual_type) + '">' + shot.visual_type + '</span>';
    if (shot.is_new) tags += '<span class="tag tag-new">NEW</span>';

    let framingRow = shot.framing ? '<div class="meta-row"><strong>Framing:</strong> ' + esc(shot.framing) + '</div>' : '';
    let lensRow = shot.lens ? '<div class="meta-row"><strong>Lens:</strong> ' + esc(shot.lens) + '</div>' : '';

    card.innerHTML =
        '<div class="card-header">' +
            '<div>' +
                '<div class="card-id">' + esc(shot.shot_id) + ' <span class="card-sub">' + esc(shot.sub_id) + '</span></div>' +
                '<div class="card-time">' + esc(shot.timestamp) + ' &middot; ' + shot.duration + 's</div>' +
            '</div>' +
            '<div class="tags">' + tags + '</div>' +
        '</div>' +
        kfThumb +
        '<div class="card-body">' +
            '<div class="meta-row"><strong>Characters:</strong> ' + esc(shot.characters) + '</div>' +
            framingRow + lensRow +
            kfSection + mpSection +
        '</div>' +
        '<div class="card-actions">' +
            '<button class="btn-approve" onclick="setDecision(\'' + shot.shot_id + '\',\'approved\')">Approve</button>' +
            '<button class="btn-reject" onclick="setDecision(\'' + shot.shot_id + '\',\'rejected\')">Reject</button>' +
            '<button class="btn-reset" onclick="resetDecision(\'' + shot.shot_id + '\')">Reset</button>' +
        '</div>' +
        '<div style="padding: 0 12px 12px;">' +
            '<textarea class="notes-area" placeholder="Notes..." onchange="setNotes(\'' + shot.shot_id + '\', this.value)">' + esc(d.notes || '') + '</textarea>' +
        '</div>';
    return card;
}

function toggleCollapsible(btn) {
    btn.classList.toggle('open');
    const content = btn.nextElementSibling;
    content.classList.toggle('open');
}

function showExport() {
    const exportData = {};
    for (const s of SHOTS) {
        const d = getDecision(s.shot_id);
        exportData[s.shot_id] = {
            status: d.status,
            notes: d.notes || '',
            sub_id: s.sub_id,
            section: s.section,
            visual_type: s.visual_type,
        };
    }
    document.getElementById('export-content').textContent = JSON.stringify(exportData, null, 2);
    document.getElementById('export-modal').classList.add('open');
}

function closeModal() {
    document.getElementById('export-modal').classList.remove('open');
}

function copyExport() {
    const text = document.getElementById('export-content').textContent;
    navigator.clipboard.writeText(text).then(function() {
        alert('Copied to clipboard!');
    }).catch(function() {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('Copied to clipboard!');
    });
}

function downloadJSON() {
    const text = document.getElementById('export-content').textContent;
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mv_qc_decisions.json';
    a.click();
    URL.revokeObjectURL(a.href);
}

function downloadCSV() {
    const rows = [['shot_id','sub_id','section','visual_type','duration','timestamp','status','notes','is_new']];
    for (const s of SHOTS) {
        const d = getDecision(s.shot_id);
        rows.push([
            s.shot_id, s.sub_id, s.section || '', s.visual_type,
            s.duration, s.timestamp, d.status, (d.notes || '').replace(/\n/g, ' '),
            s.is_new ? 'yes' : 'no'
        ]);
    }
    let csv = '';
    for (const row of rows) {
        csv += row.map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',') + '\n';
    }
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mv_qc_decisions.csv';
    a.click();
    URL.revokeObjectURL(a.href);
}

document.getElementById('export-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

renderAll();
</script>
</body>
</html>
